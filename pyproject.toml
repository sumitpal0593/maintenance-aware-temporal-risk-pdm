[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-aware-pdm"
version = "0.1.0"
description = "Reproducible code for maintenance-aware horizon-based temporal risk modelling on the Scania Component X dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
