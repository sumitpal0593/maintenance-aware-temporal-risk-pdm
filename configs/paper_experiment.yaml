experiment:
  name: paper_revision
  seed: 42
  tau: 48

data:
  ops_chunk_rows: 400000
  max_train_vehicles: null
  max_validation_vehicles: null
  min_prefix_length: 20
  samples_per_vehicle: 3

split:
  training_fraction: 0.70
  tuning_fraction: 0.15
  calibration_fraction: 0.15
  stratify: true

preprocessing:
  operational_imputation: mean
  operational_scaling: standard
  static_encoding: one_hot
  unknown_static_category: ignore
  epsilon: 1.0e-6

model:
  temporal_encoder: gru
  gru_hidden: 128
  gru_layers: 1
  static_hidden: 128
  fusion_hidden: 128
  dropout: 0.10

training:
  batch_size: 256
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  early_stopping_patience: 5
  gradient_clip_norm: 2.0
  num_workers: 0

calibration:
  method: platt

bootstrap:
  n_resamples: 5000
  confidence_level: 0.95
  seed: 42

output:
  root_dir: outputs
